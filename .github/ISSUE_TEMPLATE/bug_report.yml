name: Bug report
description: Report a problem with TermSync
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please don't include passwords, private keys, or
        sensitive host names.
  - type: input
    id: version
    attributes:
      label: TermSync version
      description: See Help → About.
      placeholder: "0.1.0-pre.3"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux (specify distro below)
        - Other
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How installed
      options:
        - Windows installer (Setup.exe)
        - Windows portable (zip)
        - Linux AppImage
        - Built from source
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Connect to …
        2. Do …
        3. See …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / output
      description: Enable File → Log Session for terminal issues; paste console output for crashes.
      render: shell
