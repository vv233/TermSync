name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    env:
      # Cache vcpkg-built packages in the GitHub Actions cache so dependencies
      # are compiled once, not on every run.
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      # Expose the tokens the vcpkg "x-gha" binary cache backend needs.
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # Autotools etc. that a few vcpkg ports still need to bootstrap.
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install autoconf automake libtool pkg-config

      - name: Install CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure
        # Link the vcpkg deps statically (default on Linux/macOS; static-md on
        # Windows) so the test binaries need no third-party DLLs at run time.
        run: >
          cmake --preset default
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          ${{ runner.os == 'Windows' && '-DVCPKG_TARGET_TRIPLET=x64-windows-static-md' || '' }}
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg

      - name: Build
        run: cmake --build --preset default

      - name: Test
        run: ctest --preset default
        env:
          QT_QPA_PLATFORM: offscreen
