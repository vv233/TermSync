name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
  QT_VERSION: "6.8.*"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure (Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Stage + deploy Qt
        shell: pwsh
        run: |
          $dist = "dist/TermSync"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/bin/termsync.exe $dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$dist/termsync.exe"
          Copy-Item README.md, LICENSE $dist/ -ErrorAction SilentlyContinue

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/TermSync/* -DestinationPath "TermSync-${{ github.ref_name }}-win64.zip"

      - name: NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $dist = Join-Path (Get-Location) "dist\TermSync"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=${{ github.ref_name }}" "/DDISTDIR=$dist" packaging/windows/installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            TermSync-*-win64.zip
            TermSync-*-Setup.exe

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          autoconf automake libtool pkg-config
          libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0
          libxcb-cursor0 libxcb-xkb1 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure (Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/termsync "$APPDIR/usr/bin/"
          cp packaging/termsync.desktop "$APPDIR/usr/share/applications/"
          cp packaging/termsync.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/"

          # The app only uses the SQLite driver; drop the other Qt sqldrivers so
          # linuxdeploy doesn't try (and fail) to bundle their client libraries
          # (e.g. libmimerapi.so for the Mimer driver).
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name '*.so' ! -name 'libqsqlite.so' -delete || true

          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          qtbase=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          wget -q "$base/linuxdeploy-x86_64.AppImage"
          wget -q "$qtbase/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT="TermSync-${{ github.ref_name }}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir "$APPDIR" --plugin qt --output appimage \
            --desktop-file "$APPDIR/usr/share/applications/termsync.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/termsync.png"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: TermSync-*-x86_64.AppImage

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
