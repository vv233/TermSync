name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VCPKG_COMMIT: cd61e1e26a038e82d6550a3ebbe0fbbfe7da78e3
  QT_VERSION: "6.8.*"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - uses: lukka/get-cmake@latest
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure (Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build

      - name: Stage + deploy Qt
        shell: pwsh
        run: |
          $dist = "dist/TermSync"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item build/bin/termsync.exe $dist/
          & "$env:QT_ROOT_DIR/bin/windeployqt.exe" --release --no-translations --compiler-runtime "$dist/termsync.exe"
          Copy-Item README.md, LICENSE $dist/ -ErrorAction SilentlyContinue

      # Sign the exe before packaging so the copies inside the zip and the
      # installer are signed too. No-ops (and does not fail) when the signing
      # secrets are absent — see docs/code-signing.md.
      - name: Sign application
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh scripts/sign-windows.ps1 -Path "dist/TermSync/termsync.exe"

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/TermSync/* -DestinationPath "TermSync-${{ github.ref_name }}-win64.zip"

      - name: NSIS installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $dist = Join-Path (Get-Location) "dist\TermSync"
          $out  = Join-Path (Get-Location) "TermSync-${{ github.ref_name }}-Setup.exe"
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" "/DVERSION=${{ github.ref_name }}" "/DDISTDIR=$dist" "/DOUTFILE=$out" packaging/windows/installer.nsi
          if (-not (Test-Path $out)) { throw "NSIS installer was not produced at $out" }
          Get-Item $out | Format-List Name, Length

      - name: Sign installer
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: pwsh scripts/sign-windows.ps1 -Path "TermSync-${{ github.ref_name }}-Setup.exe"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            TermSync-*-win64.zip
            TermSync-*-Setup.exe

  linux:
    name: Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Enable vcpkg binary cache
        uses: actions/github-script@v8
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');
      - name: Install build tools
        run: >
          sudo apt-get update && sudo apt-get install -y
          autoconf automake libtool pkg-config
          libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0
          libxcb-cursor0 libxcb-xkb1 libxcb-icccm4 libxcb-image0
          libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0
      - uses: lukka/get-cmake@latest
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          vcpkgDirectory: ${{ github.workspace }}/vcpkg

      - name: Configure (Release)
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -e
          APPDIR=AppDir
          mkdir -p "$APPDIR/usr/bin" \
                   "$APPDIR/usr/share/applications" \
                   "$APPDIR/usr/share/icons/hicolor/256x256/apps"
          cp build/bin/termsync "$APPDIR/usr/bin/"
          cp packaging/termsync.desktop "$APPDIR/usr/share/applications/"
          cp packaging/termsync.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/"

          # The app only uses the SQLite driver; drop the other Qt sqldrivers so
          # linuxdeploy doesn't try (and fail) to bundle their client libraries
          # (e.g. libmimerapi.so for the Mimer driver).
          find "$QT_ROOT_DIR/plugins/sqldrivers" -name '*.so' ! -name 'libqsqlite.so' -delete || true

          base=https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous
          qtbase=https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous
          wget -q "$base/linuxdeploy-x86_64.AppImage"
          wget -q "$qtbase/linuxdeploy-plugin-qt-x86_64.AppImage"
          chmod +x linuxdeploy*.AppImage

          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export OUTPUT="TermSync-${{ github.ref_name }}-x86_64.AppImage"
          ./linuxdeploy-x86_64.AppImage --appdir "$APPDIR" --plugin qt --output appimage \
            --desktop-file "$APPDIR/usr/share/applications/termsync.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/termsync.png"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: TermSync-*-x86_64.AppImage

  release:
    name: Publish GitHub Release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="$GITHUB_REF_NAME"
          prerelease=false
          [[ "$tag" == *-* ]] && prerelease=true

          mapfile -d '' files < <(find artifacts -type f -print0)
          if ((${#files[@]} == 0)); then
            echo "No release assets found"
            exit 1
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
            gh release edit "$tag" --prerelease="$prerelease"
          else
            args=(--verify-tag --generate-notes --title "$tag")
            [[ "$prerelease" == true ]] && args+=(--prerelease)
            gh release create "$tag" "${files[@]}" "${args[@]}"
          fi
